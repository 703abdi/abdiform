name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # builds the app, starts an in-memory Postgres + the production server, runs the browser tests
      - run: npm run test:e2e
        env:
          ADMIN_PASSWORD: ci
          SESSION_SECRET: ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
